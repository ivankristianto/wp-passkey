name: Deploy to WordPress.org
on:
  push:
    tags:
    - "*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy; must match the Version header in plugin.php'
        required: true
      dry_run:
        description: 'Prepare the SVN changes and list the planned commits without committing'
        type: boolean
        default: false
jobs:
  release:
    name: Publish to WordPress.org
    runs-on: ubuntu-latest
    steps:
    # Check out by SHA: release.yml moves the tag to its built commit, which fails checkout's tag check.
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
    - name: Check plugin version
      env:
        VERSION: ${{ inputs.version || github.ref_name }}
      run: |
        PLUGIN_VERSION=$(sed -n 's/^ \* Version: *//p' plugin.php)
        if [ "$PLUGIN_VERSION" != "$VERSION" ]; then
          echo "::error::plugin.php Version ($PLUGIN_VERSION) does not match $VERSION"
          exit 1
        fi
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
    - name: Build # Remove or modify this step as needed
      run: |
        composer install --no-dev --ignore-platform-reqs
        npm ci && npm run build
    - name: Deploy to WordPress.org SVN
      env:
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SLUG: biometric-authentication
        VERSION: ${{ inputs.version || github.ref_name }}
        DRY_RUN: ${{ inputs.dry_run || false }}
      run: bin/deploy-wporg.sh
